<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Scene Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: -apple-system, sans-serif; overflow: hidden; }
  #controls {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.7); border-radius: 12px; padding: 16px;
    color: #fff; max-width: 320px; backdrop-filter: blur(10px);
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #controls h3 { margin-bottom: 12px; font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
  .section-label { font-size: 11px; color: #666; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .model-btn {
    display: block; width: 100%; padding: 10px 14px; margin-bottom: 6px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: #ddd; font-size: 13px; cursor: pointer;
    text-align: left; transition: all 0.2s;
  }
  .model-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .model-btn.active { background: rgba(99,102,241,0.4); border-color: rgba(99,102,241,0.6); color: #fff; }
  .slider-row { margin: 6px 0; }
  .slider-row label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
  .slider-row input[type=range] { width: 100%; margin-top: 2px; }
  #anim-controls, #pos-controls {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  #info {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.6); border-radius: 8px; padding: 10px 14px;
    color: #888; font-size: 12px; backdrop-filter: blur(10px);
  }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 18px; z-index: 20; display: none;
  }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #555;
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="controls">
  <h3>Animations</h3>
  <div id="model-list"></div>
  <div id="anim-controls">
    <div class="slider-row">
      <label>Speed <span id="speed-val">1.0x</span></label>
      <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1">
    </div>
    <div style="margin-top:8px">
      <button class="model-btn" id="btn-play" style="display:inline-block;width:auto;margin-right:4px">⏸ Pause</button>
      <button class="model-btn" id="btn-reset" style="display:inline-block;width:auto">↺ Reset</button>
    </div>
  </div>
  <div id="scene-controls">
    <div class="section-label">Scene</div>
    <div class="slider-row">
      <label>Scene Scale <span id="scene-scale-val">0.50</span></label>
      <input type="range" id="scene-scale" min="0.05" max="2" step="0.05" value="0.5">
    </div>
    <div class="slider-row">
      <label>Scene Y <span id="scene-y-val">0.0</span></label>
      <input type="range" id="scene-y" min="-5" max="5" step="0.1" value="0">
    </div>
    <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">
      <button class="model-btn" id="btn-toggle-scene" style="display:inline-block;width:auto">Scene: ON</button>
      <button class="model-btn" id="btn-quality" style="display:inline-block;width:auto">Lo-Fi: OFF</button>
    </div>
  </div>
  <div id="pos-controls">
    <div class="section-label">Character Position</div>
    <div class="slider-row">
      <label>X <span id="pos-x-val">0.0</span></label>
      <input type="range" id="pos-x" min="-5" max="5" step="0.1" value="0">
    </div>
    <div class="slider-row">
      <label>Y (height) <span id="pos-y-val">0.0</span></label>
      <input type="range" id="pos-y" min="-3" max="3" step="0.05" value="0">
    </div>
    <div class="slider-row">
      <label>Z <span id="pos-z-val">0.0</span></label>
      <input type="range" id="pos-z" min="-5" max="5" step="0.1" value="0">
    </div>
    <div class="slider-row">
      <label>Rotation <span id="rot-val">0</span></label>
      <input type="range" id="rot-y" min="0" max="360" step="5" value="0">
    </div>
    <div class="slider-row">
      <label>Scale <span id="scale-val">1.00</span></label>
      <input type="range" id="char-scale" min="0.1" max="3" step="0.05" value="1">
    </div>
    <button class="model-btn" id="btn-print-pos" style="margin-top:6px">Print Position to Console</button>
  </div>
</div>
<div id="info">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
<div id="loading"><span class="spinner"></span>Loading...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SplatMesh } from '@sparkjsdev/spark';

// Scene - no background/fog when splat scene is present (splats provide the environment)
const scene = new THREE.Scene();

// Lights for the character model
scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// Camera & Renderer
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 2, 5);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1.0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.update();

// State
let mixer = null, currentAction = null, currentModel = null;
const clock = new THREE.Clock();
let isPlaying = true;

// Scene group: holds the splat scene for scaling/positioning
const sceneGroup = new THREE.Group();
sceneGroup.scale.setScalar(0.5); // Default: scale scene down to 50%
scene.add(sceneGroup);

// Character group: position/rotate/scale the character in the scene
const charGroup = new THREE.Group();
scene.add(charGroup);

const gltfLoader = new GLTFLoader();
const loadingEl = document.getElementById('loading');

let config = null;
let sharedTexture = null;

async function init() {
  try {
    const resp = await fetch('config.json');
    config = await resp.json();
  } catch (e) {
    console.error('Failed to load config.json:', e);
    document.getElementById('model-list').textContent = 'Error: config.json not found';
    return;
  }

  // Load Gaussian Splatting scene if configured
  if (config.scene) {
    loadingEl.style.display = 'block';
    loadingEl.innerHTML = '<span class="spinner"></span>Loading scene...';
    try {
      const splat = new SplatMesh({ url: config.scene });
      // Disable spherical harmonics for major performance gain
      splat.maxSh = 0;
      sceneGroup.add(splat);
      window._splat = splat; // Expose for toggle
      console.log('Loaded gaussian splatting scene:', config.scene);
    } catch (e) {
      console.error('Failed to load splat scene:', e);
    }
  }

  // Load shared texture
  if (config.texture) {
    const textureLoader = new THREE.TextureLoader();
    sharedTexture = await new Promise((resolve) => {
      textureLoader.load(config.texture, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.flipY = false;
        resolve(tex);
      });
    });
  }

  // Build model buttons
  const listEl = document.getElementById('model-list');
  config.models.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'model-btn';
    btn.dataset.index = i;
    btn.textContent = m.name;
    btn.onclick = () => loadModel(i);
    listEl.appendChild(btn);
  });

  if (config.models.length > 0) loadModel(0);
}

// Apply transferred UVs + texture (per-corner UV, non-indexed geometry)
async function applyTransferredTexture(object, uvBinPath) {
  const resp = await fetch(uvBinPath);
  const buf = await resp.arrayBuffer();
  const cornerUVs = new Float32Array(buf);

  object.traverse((child) => {
    if (child.isSkinnedMesh || child.isMesh) {
      const geo = child.geometry;
      if (geo && geo.index && geo.index.count * 2 === cornerUVs.length) {
        const newGeo = geo.toNonIndexed();
        newGeo.setAttribute('uv', new THREE.BufferAttribute(cornerUVs, 2));
        child.geometry = newGeo;
        child.material = new THREE.MeshStandardMaterial({
          map: sharedTexture, roughness: 0.6, metalness: 0.05, side: THREE.DoubleSide,
        });
      }
    }
  });
}

function loadModel(index) {
  const model = config.models[index];
  loadingEl.style.display = 'block';
  loadingEl.innerHTML = '<span class="spinner"></span>Loading model...';

  // Clear previous model from charGroup
  while (charGroup.children.length > 0) charGroup.remove(charGroup.children[0]);
  if (mixer) { mixer.stopAllAction(); mixer = null; }
  currentModel = null;

  document.querySelectorAll('.model-btn[data-index]').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  gltfLoader.load(model.path, async (gltf) => {
    const object = gltf.scene;

    if (model.uvBin) {
      await applyTransferredTexture(object, model.uvBin);
    } else if (!model.textured) {
      object.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xe8a87c, roughness: 0.5, metalness: 0.1, side: THREE.DoubleSide,
          });
        }
      });
    }

    // Center character at local origin (charGroup handles world positioning)
    let hasSkin = false;
    object.traverse((child) => { if (child.isSkinnedMesh) hasSkin = true; });

    if (hasSkin) {
      object.updateMatrixWorld(true);
      let hips = null;
      object.traverse((child) => {
        if (child.isBone && child.name === 'Hips') hips = child;
      });
      if (hips) {
        const hipsWorld = new THREE.Vector3();
        hips.getWorldPosition(hipsWorld);
        object.position.x -= hipsWorld.x;
        object.position.z -= hipsWorld.z;
      }
    } else {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      if (Math.max(size.x, size.y, size.z) > 0) {
        object.scale.setScalar(2.5 / Math.max(size.x, size.y, size.z));
      }
      object.updateMatrixWorld(true);
      const box2 = new THREE.Box3().setFromObject(object);
      const center = box2.getCenter(new THREE.Vector3());
      object.position.x -= center.x;
      object.position.z -= center.z;
      object.position.y -= box2.min.y;
    }

    charGroup.add(object);
    currentModel = object;

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(object);
      currentAction = mixer.clipAction(gltf.animations[0]);
      currentAction.play();
      isPlaying = true;
      document.getElementById('btn-play').textContent = '⏸ Pause';
    } else {
      currentAction = null;
    }
    loadingEl.style.display = 'none';
  }, undefined, (err) => { console.error(err); loadingEl.style.display = 'none'; });
}

// === Scene controls ===
function updateSceneTransform() {
  const s = parseFloat(document.getElementById('scene-scale').value);
  const y = parseFloat(document.getElementById('scene-y').value);
  sceneGroup.scale.setScalar(s);
  sceneGroup.position.y = y;
  document.getElementById('scene-scale-val').textContent = s.toFixed(2);
  document.getElementById('scene-y-val').textContent = y.toFixed(1);
}
['scene-scale', 'scene-y'].forEach(id => {
  document.getElementById(id).oninput = updateSceneTransform;
});

// Toggle scene visibility
document.getElementById('btn-toggle-scene').onclick = () => {
  sceneGroup.visible = !sceneGroup.visible;
  document.getElementById('btn-toggle-scene').textContent = 'Scene: ' + (sceneGroup.visible ? 'ON' : 'OFF');
};

// Lo-Fi mode: lower pixel ratio for performance
let lofi = false;
document.getElementById('btn-quality').onclick = () => {
  lofi = !lofi;
  renderer.setPixelRatio(lofi ? 0.5 : 1.0);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('btn-quality').textContent = 'Lo-Fi: ' + (lofi ? 'ON' : 'OFF');
};

// === Character position controls ===
function updateCharPosition() {
  const x = parseFloat(document.getElementById('pos-x').value);
  const y = parseFloat(document.getElementById('pos-y').value);
  const z = parseFloat(document.getElementById('pos-z').value);
  const rotDeg = parseFloat(document.getElementById('rot-y').value);
  const s = parseFloat(document.getElementById('char-scale').value);

  charGroup.position.set(x, y, z);
  charGroup.rotation.y = rotDeg * Math.PI / 180;
  charGroup.scale.setScalar(s);

  document.getElementById('pos-x-val').textContent = x.toFixed(1);
  document.getElementById('pos-y-val').textContent = y.toFixed(2);
  document.getElementById('pos-z-val').textContent = z.toFixed(1);
  document.getElementById('rot-val').textContent = rotDeg + '\u00B0';
  document.getElementById('scale-val').textContent = s.toFixed(2);
}

['pos-x', 'pos-y', 'pos-z', 'rot-y', 'char-scale'].forEach(id => {
  document.getElementById(id).oninput = updateCharPosition;
});

// Print current position to console (for saving)
document.getElementById('btn-print-pos').onclick = () => {
  const pos = charGroup.position;
  const rot = parseFloat(document.getElementById('rot-y').value);
  const s = parseFloat(document.getElementById('char-scale').value);
  console.log(JSON.stringify({
    position: [+pos.x.toFixed(2), +pos.y.toFixed(2), +pos.z.toFixed(2)],
    rotation: rot,
    scale: +s.toFixed(2)
  }));
};

// Speed
document.getElementById('speed-slider').oninput = function() {
  const v = parseFloat(this.value);
  document.getElementById('speed-val').textContent = v.toFixed(1) + 'x';
  if (mixer) mixer.timeScale = v;
};

// Play/Pause
document.getElementById('btn-play').onclick = () => {
  isPlaying = !isPlaying;
  document.getElementById('btn-play').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  if (currentAction) currentAction.paused = !isPlaying;
};

// Reset
document.getElementById('btn-reset').onclick = () => {
  if (currentAction) {
    currentAction.reset(); currentAction.play();
    isPlaying = true;
    document.getElementById('btn-play').textContent = '⏸ Pause';
  }
};

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Render loop
(function animate() {
  requestAnimationFrame(animate);
  if (mixer && isPlaying) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
})();

init();
</script>
</body>
</html>
